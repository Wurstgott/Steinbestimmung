<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Steinbestimmung – Edelsteine entdecken</title>
<meta name="description" content="25 Edelsteine spielerisch entdecken: roh und geschliffen, mit Bedeutung und Quiz.">
<meta name="theme-color" content="#fbf8f4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="wrap" id="home">
  <header class="hero">
    <h1>Steinbestimmung</h1>
    <p>25 Schätze zum Entdecken – so, wie die Natur sie macht, und so, wie sie geschliffen funkeln.</p>
  </header>

  <div class="actions">
    <button class="btn" id="draw">🎲 Zieh einen Stein</button>
    <button class="btn alt" id="quizBtn">🔍 Stein-Quiz</button>
  </div>

  <div class="switch" id="switch" role="group" aria-label="Ansicht">
    <button data-v="r" aria-pressed="true">Natur</button>
    <button data-v="s" aria-pressed="false">Geschliffen</button>
  </div>

  <div class="chips" id="chips" role="group" aria-label="Was brauchst du heute?"></div>
  <section class="grid" id="grid" aria-label="Alle Steine"></section>

  <footer class="foot">
    <p>Die Bedeutungen sind überlieferte Zuschreibungen – schön zum Träumen, aber kein Ersatz für ärztlichen Rat.</p>
    <p><button id="credBtn">Bildnachweise</button></p>
  </footer>
</main>

<div id="overlay"></div>

<script src="data.js"></script>
<script src="credits.js"></script>
<script src="app.js"></script>
</body>
</html>
